<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay Van Driver Pay Calculator: NG15</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- CSS STYLES --- */
        html, body {
            margin: 0; padding: 0;
            background: #F8F9FA; /* Light grey background for better contrast */
            color: #121212;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .container { 
            max-width: 720px; 
            margin: 0 auto; 
            padding: 40px 16px; 
        }
        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        .calculator {
            background: #FFFFFF;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .form-row { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            margin-bottom: 20px; 
        }
        .form-group-col { flex: 1 1 200px; }
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-size: 14px;
            color: #444;
        }
        select, input[type=range] {
            width: 100%;
            background: #FFF;
            border: 1px solid #DDD;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type=range] { padding: 0; height: 32px; cursor: pointer; }
        
        /* Results Section */
        #results-container {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #F0F0F0;
            text-align: center;
        }
        .hero-result .label { 
            font-size: 16px; 
            color: #666; 
            margin-bottom: 8px; 
        }
        .hero-result .value-chip {
            display: inline-block;
            background: #D6EC83; /* Relay Lime Green */
            color: #121212;
            border-radius: 12px;
            padding: 16px 32px;
            font-weight: 800;
            font-size: 36px;
        }
        .other-metrics {
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            margin-top: 24px;
        }
        .metric .v { font-weight: 700; font-size: 20px; color: #121212; }
        .metric .k { font-size: 13px; color: #777; margin-top: 4px; }
        
        .compatible-areas { 
            margin-top: 24px; 
            background: #F9F9F9;
            padding: 16px;
            border-radius: 8px;
        }
        .area-list { font-weight: 700; color: #121212; font-size: 16px; margin-top: 4px; }
        .hint { font-size: 12px; color: #999; margin-top: 6px; }

        @media (max-width: 600px) {
            .page-title { font-size: 22px; }
            .form-row { flex-direction: column; gap: 16px; }
            .hero-result .value-chip { font-size: 28px; width: 80%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="page-title">Relay Driver Pay: NG15</h1>
        
        <section class="calculator">
            <div class="form-row">
                <div class="form-group-col">
                    <label for="shiftDuration">1. Shift Duration</label>
                    <select id="shiftDuration"></select>
                </div>
                <div class="form-group-col">
                    <label for="vanType">2. Van Size</label>
                    <select id="vanType">
                        <option value="LWB">Long Wheelbase (LWB)</option>
                        <option value="XLWB">Extra Long Wheelbase (XLWB)</option>
                        <option value="Luton">Luton Van</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group-col">
                    <label for="daysWeek">3. Days per week: <span id="daysLabel" style="color:#121212; font-weight:800;">5</span></label>
                    <input id="daysWeek" type="range" min="1" max="7" step="1" value="5" />
                    <div class="hint">Adjust slider for weekly total.</div>
                </div>
            </div>

            <div id="results-container"></div>
        </section>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */
        document.addEventListener('DOMContentLoaded', function() {
            const ROUTE_DATA = {
                'NG15': {
                    'Nottingham': {shift:6},
                    'Sheffield':  {shift:7},
                    'Birmingham': {shift:8},
                    'Manchester': {shift:9},
                    'Liverpool':  {shift:10}
                }
            };

            const shiftEl = document.getElementById('shiftDuration');
            const vanTypeEl = document.getElementById('vanType');
            const daysEl = document.getElementById('daysWeek');
            const daysLabel = document.getElementById('daysLabel');
            const DEPOT_CODE = 'NG15';

            function populateShifts() {
                const durations = [...new Set(Object.values(ROUTE_DATA[DEPOT_CODE]).map(r => r.shift))].sort((a,b) => a-b);
                shiftEl.innerHTML = durations.map(d => `<option value="${d}">${d} hours</option>`).join('');
            }

            function payFor(hours, vanType) {
                const rates = {
                    6:  { LWB: 115, XLWB: 121, Luton: 127 },
                    7:  { LWB: 131, XLWB: 138, Luton: 145 },
                    8:  { LWB: 141, XLWB: 148, Luton: 155 },
                    9:  { LWB: 157, XLWB: 165, Luton: 173 },
                    10: { LWB: 175, XLWB: 185, Luton: 195 }
                };
                return rates[hours] ? rates[hours][vanType] : 0;
            }

            function render() {
                const hours = Number(shiftEl.value);
                const days = Number(daysEl.value);
                const van = vanTypeEl.value;
                daysLabel.textContent = days;

                const perShift = payFor(hours, van);
                const total = perShift * days;
                
                const areas = Object.entries(ROUTE_DATA[DEPOT_CODE])
                                    .filter(([_, data]) => data.shift === hours)
                                    .map(([name]) => name).join(' or ');

                document.getElementById('results-container').innerHTML = `
                    <div class="hero-result">
                        <div class="label">Estimated Weekly Pay</div>
                        <div class="value-chip">£${total}</div>
                    </div>
                    <div class="other-metrics">
                        <div class="metric">
                            <div class="v">£${perShift}</div>
                            <div class="k">Daily Rate</div>
                        </div>
                        <div class="metric">
                            <div class="v">${hours} hrs</div>
                            <div class="k">Shift Time</div>
                        </div>
                    </div>
                    <div class="compatible-areas">
                        <div class="label" style="font-size:13px; color:#888;">Example Route for this shift:</div>
                        <div class="area-list">${areas}</div>
                    </div>`;
            }

            shiftEl.onchange = render;
            vanTypeEl.onchange = render;
            daysEl.oninput = render;

            populateShifts();
            render();
        });
    </script>
</body>
</html>
